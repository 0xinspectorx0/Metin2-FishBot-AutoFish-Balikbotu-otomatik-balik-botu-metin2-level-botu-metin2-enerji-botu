# -----------------------------------------------------------------------------
# Otomatik derleme (CI)
#
# Neden var?
#   Proje .NET Framework 4.7.2 hedefleyen, Windows'a özgü P/Invoke kullanan bir
#   WinForms uygulaması. Bu yüzden Linux/macOS üzerinde DERLENEMEZ. Bakım turu
#   sırasında geliştirme ortamında msbuild/dotnet/mono kurulamadığı için kod
#   derlenerek doğrulanamadı; bu iş akışı o boşluğu kapatır:
#   GitHub'ın Windows koşucusunda gerçek bir MSBuild derlemesi yapar ve
#   çalıştırılabilir çıktıyı (exe + dll + tüm içerik klasörleri) zip olarak sunar.
#
# Ne zaman çalışır?
#   * v* biçimindeki bir etiket push edildiğinde (ör. v1.0.4)
#     → Release oluşturur ve zip'i asset olarak ekler.
#   * main veya arena/* dallarına push edildiğinde ve Pull Request'lerde
#     → yalnızca derleme doğrulaması (zip artifact olarak saklanır).
#   * Elle: depo sayfası → Actions → "Derle ve paketle" → "Run workflow".
#
# Not: Depo ayarlarında Actions kapalıysa bu iş akışı çalışmaz.
#      Ayarlar → Actions → General → "Allow all actions and workflows".
# -----------------------------------------------------------------------------
name: Derle ve paketle

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # Release/asset olusturabilmek icin
  issues: write     # Derleme hatasini issue yorumu olarak raporlayabilmek icin

jobs:
  build:
    name: MSBuild (Release, x86/AnyCPU)
    runs-on: windows-2022

    steps:
      # Depo adı çok uzun olduğu için Windows koşucusundaki 260 karakter yol sınırı
      # (MAX_PATH) git ref dosyalarında aşılıyor ve checkout "Filename too long"
      # hatasıyla başarısız oluyordu. İki önlem:
      #   1) core.longpaths=true  (git'in uzun yol desteği)
      #   2) sığ + tek dallı çekim (uzun remote ref adları hiç oluşturulmaz)
      - name: Uzun yol desteğini aç (Windows MAX_PATH)
        run: |
          git config --system core.longpaths true 2>$null
          if ($LASTEXITCODE -ne 0) {
            git config --global core.longpaths true
          }
          git config --system --get core.longpaths
        shell: pwsh

      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      # NuGet paketleri depoda TUTULMUYOR (packages/ .gitignore içinde); geri
      # yüklenmeden derleme "dosya bulunamadı" hatası verir.
      - name: NuGet paketlerini geri yükle
        run: nuget restore MusicPlayerApp.sln -Verbosity detailed

      - name: MSBuild sürümünü bul
        uses: microsoft/setup-msbuild@v2

      # Log dosyaya yazılır: Actions log'ları Azure blob üzerinde tutulduğu için
      # bazı ortamlardan (ör. kapalı ağ) indirilemiyor. Hataları API üzerinden
      # okuyabilmek için özet aşağıdaki "Derleme sonucunu raporla" adımında
      # job summary + issue yorumu olarak yayımlanır.
      - name: Derle (Release)
        id: build
        continue-on-error: true
        run: |
          msbuild MusicPlayerApp.sln `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:DebugSymbols=false `
            /verbosity:normal `
            /consoleloggerparameters:Summary `
            /m 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          "exitcode=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $code
        shell: pwsh

      - name: Derleme sonucunu raporla
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_EXIT: ${{ steps.build.outputs.exitcode }}
        run: |
          set -uo pipefail
          EXIT="${BUILD_EXIT:-1}"
          if [ -f build.log ]; then
            # MSBuild hem dosya bazlı (path(l,c): error CS1234) hem de özet
            # ("      3 Error(s)") satırları üretir; ikisi de yakalanır.
            grep -inE "error" build.log | sed 's/^[[:space:]]*//' | sort -u > derleme-hatalari.txt || true
          else
            : > derleme-hatalari.txt
          fi
          COUNT=$(wc -l < derleme-hatalari.txt | tr -d ' ')

          {
            echo "### Otomatik derleme sonucu"
            echo
            echo "- Çıkış kodu: `$EXIT` — benzersiz hata satırı: **$COUNT**"
            echo "- Ref: `$GITHUB_REF_NAME`  Commit: `$GITHUB_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            {
              echo
              echo '```'
              head -n 80 derleme-hatalari.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Hata deseni eşleşmese bile logun sonu özete yazılır: böylece
          # Actions log'larına erişilemeyen ortamlardan da teşhis yapılabilir.
          if [ -f build.log ]; then
            {
              echo
              echo "<details><summary>build.log — son 80 satır</summary>"
              echo
              echo '```'
              tail -n 80 build.log
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$COUNT" -gt 0 ]; then
            :

            # Log'lar Azure blob üzerinde tutulduğu için kapalı ağlardan
            # indirilemeyebiliyor; hatalar bu yüzden API üzerinden okunabilen
            # bir issue yorumu olarak da yayımlanır.
            {
              echo "### Otomatik derleme BAŞARISIZ :x:"
              echo
              echo "- Çalıştırma: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Ref: `$GITHUB_REF_NAME`  Commit: `$GITHUB_SHA`"
              echo
              echo '```'
              head -n 40 derleme-hatalari.txt
              echo '```'
              echo
              echo "> Bu yorum, `Derleme sonucunu raporla` adımı tarafından otomatik oluşturuldu."
              echo "> Tam log: Actions → ilgili çalıştırma → `derleme-loglari` artifact'i."
            } > yorum.md
            # Not: yorum ISSUES'a değil COMMIT'e yazılır. Sebep: Actions
            # log'ları Azure blob üzerinde tutulduğu için bazı ağlardan
            # indirilemiyor; commit yorumu ise REST API'den doğrudan
            # okunabiliyor (GET /repos/{owner}/{repo}/commits/{sha}/comments).
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -F body=@yorum.md > /dev/null || echo "Commit yorumu yayımlanamadı."
          fi

          echo "$EXIT" > build-exit.txt
          if [ "$EXIT" != "0" ]; then
            echo "::error::Derleme başarısız (çıkış kodu $EXIT, $COUNT hata). Ayrıntı job summary'de."
            exit 1
          fi
        shell: bash

      # ---------------------------------------------------------------------
      # Tanılama kanalı: logları 'ci-logs' dalına yayımla
      #
      # Actions log'ları Azure blob (*.blob.core.windows.net) üzerinde
      # tutuluyor ve bazı ağlardan (ör. kapalı geliştirme ortamları)
      # indirilemiyor. Commit/issue yorumu da bu token ile yazılamadı.
      # Çözüm: log, api.github.com üzerinden okunabilen bir dala dosya olarak
      # yazılır:
      #   gh api /repos/{owner}/{repo}/contents/build-<run>.log?ref=ci-logs
      # ---------------------------------------------------------------------
      - name: Logları ci-logs dalına yayımla
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="$GITHUB_REPOSITORY"
          LOGNAME="build-$GITHUB_RUN_ID.log"
          ERRNAME="errors-$GITHUB_RUN_ID.txt"

          # Keep the API payload small and valid UTF-8. GitHub Actions logs are
          # stored on Azure blob, which may be inaccessible from this environment.
          : > build.log.tmp
          if [ -f build.log ]; then
            tail -c 60000 build.log | iconv -c -f UTF-8 -t UTF-8 > build.log.tmp || tail -c 60000 build.log > build.log.tmp
          fi
          : > derleme-hatalari.tmp
          if [ -f derleme-hatalari.txt ]; then
            head -c 20000 derleme-hatalari.txt | iconv -c -f UTF-8 -t UTF-8 > derleme-hatalari.tmp || head -c 20000 derleme-hatalari.txt > derleme-hatalari.tmp
          fi

          publish_file() {
            local path="$1" local_file="$2" message="$3" content payload response
            content=$(base64 -w0 "$local_file")
            payload=$(jq -n --arg message "$message" --arg content "$content" --arg branch "ci-logs"               '{message:$message, content:$content, branch:$branch}')
            response=$(printf '%s' "$payload" | gh api --method PUT               "/repos/$REPO/contents/$path" --input - 2>&1) || {
                echo "GitHub Contents API upload failed for $path: $response"
                echo "::error title=CI log upload failed::$path — $response"
                return 1
              }
            echo "Published $path"
          }

          publish_file "$LOGNAME" build.log.tmp             "ci: build log for run $GITHUB_RUN_ID ($GITHUB_REF_NAME @ ${GITHUB_SHA:0:7})" || true
          publish_file "$ERRNAME" derleme-hatalari.tmp             "ci: compiler errors for run $GITHUB_RUN_ID ($GITHUB_REF_NAME @ ${GITHUB_SHA:0:7})" || true
        shell: bash

      - name: Çıktıyı doğrula
        if: success()
        run: |
          if (-not (Test-Path 'bin\Release\Metin2AutoFishCSharp.exe')) {
            Write-Error 'Metin2AutoFishCSharp.exe üretilmedi — derleme başarısız.'
            exit 1
          }
          Write-Host 'Çıktı listesi:'
          Get-ChildItem -Recurse bin\Release | Select-Object -ExpandProperty FullName
        shell: pwsh

      - name: Dağıtım klasörünü hazırla
        if: success()
        run: |
          $stage = 'dist\Metin2AutoFishCSharp'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # exe + dll + exe.config + manifest
          Copy-Item 'bin\Release\*' $stage -Recurse -Force
          # pdb/xml dokümantasyon dosyaları dağıtımda gereksiz
          Get-ChildItem -Recurse $stage -Include *.pdb,*.xml | Remove-Item -Force
          Write-Host "Hazırlanan klasör: $stage"
        shell: pwsh

      - name: Zip oluştur
        if: success()
        run: |
          $ver = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0,7) }
          $zip = "Metin2AutoFishCSharp-$ver-win-x64.zip"
          Compress-Archive -Path 'dist\Metin2AutoFishCSharp\*' -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_ADI=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Oluşturulan paket: $zip"
        shell: pwsh

      # Etiket dışı çalıştırmalarda zip yalnızca artifact olarak saklanır.
      - name: Derleme loglarını artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derleme-loglari
          path: |
            build.log
            derleme-hatalari.txt
            build-exit.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Zip'i artifact olarak yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Metin2AutoFishCSharp-derleme
          path: ${{ env.ZIP_ADI }}
          if-no-files-found: error
          retention-days: 30

      # Etiket push edildiğinde doğrudan Release yayımlanır.
      - name: Release yayımla (yalnızca etiketlerde)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_ADI }}
          generate_release_notes: false
          fail_on_unmatched_files: true
